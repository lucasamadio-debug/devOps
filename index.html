<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador Digital MVC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400 flex items-center justify-center gap-2">
        <i data-lucide="dices" class="w-8 h-8 text-indigo-400"></i> Sorteador Digital
      </h1>
      <p class="text-slate-400 text-sm">Arquitetura MVC (Model - View - Controller)</p>
    </header>

    <!-- Alternador de Abas -->
    <div class="grid grid-cols-2 p-1 bg-slate-950 rounded-xl border border-slate-800">
      <button id="tabNumbers" class="py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md">
        Números
      </button>
      <button id="tabNames" class="py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white">
        Nomes / Lista
      </button>
    </div>

    <!-- Seção Números -->
    <section id="sectionNumbers" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Mínimo</label>
          <input type="number" id="inputMin" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Máximo</label>
          <input type="number" id="inputMax" value="100" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 items-center">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Quantidade</label>
          <input type="number" id="inputNumCount" value="1" min="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div class="flex items-center gap-2 pt-5">
          <input type="checkbox" id="checkDuplicates" class="w-4 h-4 rounded border-slate-800 text-indigo-600 focus:ring-indigo-500 bg-slate-950">
          <label for="checkDuplicates" class="text-xs text-slate-300">Permitir repetição</label>
        </div>
      </div>
    </section>

    <!-- Seção Nomes -->
    <section id="sectionNames" class="space-y-4 hidden">
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Lista de Nomes</label>
          <span id="nameCounter" class="text-xs text-indigo-400 font-medium">0 nomes identificados</span>
        </div>
        <textarea id="inputNames" rows="4" placeholder="Insira um nome por linha ou separados por vírgula..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Quantidade de Ganhadores</label>
        <input type="number" id="inputNameCount" value="1" min="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>
    </section>

    <!-- Botão Principal -->
    <button id="btnSortear" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition duration-200 transform active:scale-95 flex items-center justify-center gap-2 text-lg">
      <i data-lucide="play" class="w-5 h-5"></i> Sortear Agora
    </button>

    <!-- Área de Resultados -->
    <div id="resultBox" class="bg-slate-950 border border-slate-800 rounded-xl p-6 text-center space-y-3 min-h-[120px] flex flex-col justify-center items-center relative overflow-hidden">
      <p id="resultPlaceholder" class="text-slate-500 text-sm">O resultado aparecerá aqui</p>
      <div id="resultDisplay" class="flex flex-wrap justify-center gap-3 hidden"></div>
    </div>

    <!-- Histórico -->
    <div class="border-t border-slate-800 pt-4 space-y-2">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1">
          <i data-lucide="history" class="w-4 h-4"></i> Histórico Recente
        </h3>
        <button id="btnClearHistory" class="text-xs text-rose-400 hover:text-rose-300 transition hidden">Limpar</button>
      </div>
      <ul id="historyList" class="space-y-1.5 max-h-36 overflow-y-auto pr-1 text-sm text-slate-300"></ul>
    </div>
  </div>

  <!-- Scripts JS (Estrutura MVC) -->
  <script src="js/models/SorteadorModel.js"></script>
  <script src="js/views/SorteadorView.js"></script>
  <script src="js/controllers/SorteadorController.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
